[package]
name = "myshell"
version = "1.4.1"
edition = "2021"
description = "A Rust-based SSH/SFTP shell tool inspired by FinalShell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = "0.50"
russh-sftp = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
env_logger = "0.11"
dirs = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
suppaftp = { version = "8", features = ["tokio", "async-secure", "tokio-rustls-ring"] }
tokio-socks = "0.5"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = "0.4"
# Local terminal: spawn a shell under a PTY (ConPTY on Windows, openpty on Unix).
portable-pty = "0.8"
# AI assistant: HTTP client for provider APIs (Claude / OpenAI / Ollama).
# rustls-tls matches suppaftp's tokio-rustls-ring (no OpenSSL on Windows);
# "stream" gives Response::bytes_stream() for SSE token streaming.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "socks"] }
futures-util = "0.3"
# Enumerate installed font families for the terminal font picker.
font-kit = "0.14"

# Windows-only: detect process elevation + relaunch as admin (ShellExecuteW
# "runas"). Pulled in transitively by portable-pty/font-kit; declared here so we
# can use it directly with the features below.
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi",
    "securitybaseapi",
    "winnt",
    "handleapi",
    "shellapi",
    "winuser",
] }
