<?xml version="1.0" encoding="UTF-8"?>
<!-- MyShell — Concept C "Aperture" — shell nucleus / glowing portal -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="c-base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15151b"/>
      <stop offset="1" stop-color="#070708"/>
    </linearGradient>
    <radialGradient id="c-indigo" cx="22%" cy="16%" r="62%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="c-cyan" cx="84%" cy="88%" r="56%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="c-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="c-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="c-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="cc"/>
      <feMerge>
        <feMergeNode in="cc"/>
        <feMergeNode in="cc"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="c-clip"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <g clip-path="url(#c-clip)">
    <rect width="1024" height="1024" fill="url(#c-base)"/>
    <rect width="1024" height="1024" fill="url(#c-indigo)"/>
    <rect width="1024" height="1024" fill="url(#c-cyan)"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="225" fill="url(#c-sheen)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="226" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <g filter="url(#c-glow)">
    <path d="M656,330 L384,512 L656,694" fill="none" stroke="url(#c-mark)" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M560,452 L470,512 L560,572" fill="none" stroke="#67e8f9" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <circle cx="384" cy="512" r="30" fill="#22d3ee"/>
  </g>
</svg>
