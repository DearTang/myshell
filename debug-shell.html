<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyShell Shell Debug</title>
    <script>
      // Tauri IPC stub —— 调试页跑在纯浏览器里（复现顶栏+折叠侧栏布局用）
      let __cb = 0;
      window.__TAURI_INTERNALS__ = {
        metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
        plugins: {},
        invoke: (cmd) => {
          if (cmd === "get_connections") return [];
          if (cmd === "list_folders") return [];
          return null;
        },
        transformCallback: () => ++__cb,
      };
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/debug-shell.ts"></script>
  </body>
</html>
